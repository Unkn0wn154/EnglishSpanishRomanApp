<script src="files.js"></script>
<script>
// load only the chosen course's data, then the engine (?course=en / ?course=es switches too)
const asked = new URLSearchParams(location.search).get('course');
if (asked === 'en' || asked === 'es') localStorage.setItem('esen-course', asked);
const COURSE = localStorage.getItem('esen-course') === 'en' ? 'en' : 'es';
document.documentElement.lang = COURSE;
for (const f of FILES[COURSE]) document.write(`<script src="${COURSE}/${f}"><\/script>`);
document.write('<script src="app.js"><\/script>');
</script>
</body>
